<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Pendente — REVELA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--y:#FFD600;--p:#070A0B;--c:#8A9399;--b:#F0F4F2}
body{background:var(--p);color:var(--b);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{text-align:center;max-width:440px}
.icon{width:80px;height:80px;background:rgba(255,214,0,.1);border:2px solid var(--y);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:6px;margin-bottom:24px}
.logo span{color:var(--y)}
h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;margin-bottom:12px;color:var(--y)}
p{font-size:14px;color:var(--c);line-height:1.7;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--y);color:var(--p);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:14px 28px;border-radius:2px;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="box">
  <div class="logo">REVEL<span>A</span></div>
  <div class="icon">⏳</div>
  <h1>Pagamento Pendente</h1>
  <p>Seu pagamento está sendo processado (comum em boletos e alguns PIX). Você receberá uma confirmação em breve.</p>
  <a href="index.html" class="btn">Voltar ao início</a>
</div>
</body>
</html>
