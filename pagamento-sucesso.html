<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Aprovado — REVELA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--v:#00E676;--ve:#00B050;--p:#070A0B;--p2:#0E1315;--c:#8A9399;--b:#F0F4F2}
body{background:var(--p);color:var(--b);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{text-align:center;max-width:440px}
.icon{width:80px;height:80px;background:rgba(0,230,118,.1);border:2px solid var(--v);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:6px;margin-bottom:24px}
.logo span{color:var(--v)}
h1{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1px;margin-bottom:12px;color:var(--v)}
p{font-size:14px;color:var(--c);line-height:1.7;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--v);color:var(--p);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:14px 28px;border-radius:2px;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--ve)}
.status{font-size:12px;color:var(--c);margin-top:20px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">REVEL<span>A</span></div>
  <div class="icon">✓</div>
  <h1>Pagamento Aprovado!</h1>
  <p id="msg">Seu plano foi ativado com sucesso. Agora você já pode aproveitar todos os recursos da plataforma.</p>
  <a href="index.html" class="btn" id="btnGo">Ir para meu painel</a>
  <div class="status" id="status">Ativando seu plano...</div>
</div>
<script>
const SURL='https://yrthxqmzuwurgthdfozx.supabase.co';
const SKEY='sb_publishable_sPcnhj8prRj6UagRwFqrUA_73ZeFxC5';
const {createClient}=supabase;
const sb=createClient(SURL,SKEY);

async function ativarPlano(){
  const params=new URLSearchParams(window.location.search);
  const tipo=params.get('tipo')||'atleta';

  const{data:{session}}=await sb.auth.getSession();
  if(session){
    const tabela=tipo==='atleta'?'atletas':'olheiros';
    await sb.from(tabela).update({plano_ativo:true,plano_ativado_em:new Date().toISOString()}).eq('id',session.user.id);
    document.getElementById('btnGo').href=tipo==='atleta'?'painel-atleta.html':'painel-olheiro.html';
    document.getElementById('status').textContent='✓ Plano ativado com sucesso!';
  } else {
    document.getElementById('status').textContent='Faça login para ver seu plano ativo.';
  }
}
ativarPlano();
</script>
</body>
</html>
