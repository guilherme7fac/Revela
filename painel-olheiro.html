<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Olheiro — REVELA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--v:#00E676;--ve:#00B050;--p:#070A0B;--p2:#0E1315;--p3:#161D20;--c:#8A9399;--b:#F0F4F2;--y:#FFD600;--r:#ff6b6b}
body{background:var(--p);color:var(--b);font-family:'DM Sans',sans-serif;min-height:100vh}
.loading{position:fixed;inset:0;background:var(--p);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px}
.loading-logo{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:8px}.loading-logo span{color:var(--v)}
.loading-bar{width:200px;height:2px;background:rgba(255,255,255,.1);border-radius:1px;overflow:hidden}
.loading-bar::after{content:'';display:block;height:100%;background:var(--v);animation:load 1.5s ease-in-out infinite}
@keyframes load{0%{width:0%;transform:translateX(0)}50%{width:100%}100%{width:0%;transform:translateX(200px)}}
nav{background:var(--p2);border-bottom:1px solid rgba(255,255,255,.06);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:5px;color:var(--b);text-decoration:none}.logo span{color:var(--v)}
.nav-right{display:flex;align-items:center;gap:14px}
.user-name{font-size:13px;color:var(--c)}
.btn-sair{background:none;border:1px solid rgba(255,255,255,.1);color:var(--c);font-size:12px;padding:7px 14px;border-radius:2px;cursor:pointer;transition:border-color .2s,color .2s}.btn-sair:hover{border-color:rgba(255,60,60,.4);color:var(--r)}
.main{max-width:1100px;margin:0 auto;padding:40px 24px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:1px;color:var(--b);margin-bottom:4px}
.page-sub{font-size:14px;color:var(--c);margin-bottom:32px}

/* FILTROS */
.filtros{background:var(--p2);border:1px solid rgba(255,255,255,.06);border-radius:4px;padding:20px 24px;margin-bottom:24px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
.fg label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:5px}
.fg select,.fg input{width:100%;background:var(--p3);border:1px solid rgba(255,255,255,.07);border-radius:2px;padding:10px 12px;color:var(--b);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.fg select:focus,.fg input:focus{border-color:var(--v)}
.fg select option{background:var(--p3)}
.btn-buscar{background:var(--v);color:var(--p);font-weight:500;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:11px 22px;border:none;border-radius:2px;cursor:pointer;transition:background .2s;white-space:nowrap}
.btn-buscar:hover{background:var(--ve)}

/* RESULTADOS */
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.results-count{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.results-count span{color:var(--v)}

/* CARDS ATLETAS */
.atletas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.atleta-card{background:var(--p2);border:1px solid rgba(255,255,255,.06);border-radius:4px;overflow:hidden;transition:border-color .3s,transform .3s}
.atleta-card:hover{border-color:rgba(0,230,118,.2);transform:translateY(-3px)}

.ac-top{padding:20px 20px 16px}
.ac-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.ac-avatar{width:48px;height:48px;background:rgba(0,230,118,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--v);flex-shrink:0}
.ac-score-big{text-align:right}
.ac-score-num{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1}
.ac-score-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.score-alto{color:var(--v)}.score-medio{color:var(--y)}.score-baixo{color:var(--r)}

.ac-nome{font-weight:500;font-size:15px;color:var(--b);margin-bottom:4px}
.ac-loc{font-size:12px;color:var(--c);margin-bottom:12px}
.ac-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ac-tag{font-size:11px;color:var(--c);background:var(--p3);padding:3px 8px;border-radius:2px}
.ac-tag.pos{background:rgba(0,230,118,.1);color:var(--v);font-weight:500}

/* MINI SCORES */
.mini-scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.ms-item{background:var(--p3);border-radius:2px;padding:8px 6px;text-align:center}
.ms-label{font-size:9px;color:var(--c);margin-bottom:3px;letter-spacing:.04em}
.ms-val{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1}

/* RESUMO IA */
.ac-resumo{font-size:12px;color:var(--c);line-height:1.6;background:var(--p3);padding:10px 12px;border-radius:2px;border-left:2px solid var(--v);margin-bottom:14px}

/* PONTOS */
.ac-pontos{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.ac-ponto{font-size:11px;display:flex;gap:6px;align-items:flex-start}
.ac-ponto.pos{color:rgba(0,230,118,.8)}
.ac-ponto.neg{color:rgba(255,107,107,.75)}

/* RECOMENDAÇÃO */
.ac-rec{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--v);text-transform:uppercase;margin-bottom:14px}

/* SEM IA */
.sem-ia{background:rgba(255,255,255,.03);border-radius:2px;padding:14px;text-align:center;margin-bottom:14px}
.sem-ia-icon{font-size:24px;margin-bottom:6px}
.sem-ia-txt{font-size:12px;color:var(--c)}

/* FOOTER CARD */
.ac-footer{border-top:1px solid rgba(255,255,255,.06);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.btn-video{display:inline-flex;align-items:center;gap:6px;background:var(--v);color:var(--p);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:8px 16px;border-radius:2px;text-decoration:none;transition:background .2s}
.btn-video:hover{background:var(--ve)}
.btn-video-sem{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--c);font-size:12px;padding:8px 16px;border-radius:2px;border:1px solid rgba(255,255,255,.08)}
.ac-data{font-size:11px;color:var(--c)}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 24px}
.empty-state .emo{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;color:var(--c)}

@media(max-width:1000px){.atletas-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.filtros{grid-template-columns:1fr 1fr}.filtros .btn-buscar{grid-column:1/-1}.atletas-grid{grid-template-columns:1fr}nav{padding:14px 16px}.main{padding:24px 16px}}
@media(max-width:480px){.filtros{grid-template-columns:1fr}.mini-scores{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="loading-logo">REVEL<span>A</span></div>
  <div class="loading-bar"></div>
</div>
<nav>
  <a href="index.html" class="logo">REVEL<span>A</span></a>
  <div class="nav-right">
    <span class="user-name" id="userEmail">—</span>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</nav>
<main class="main">
  <div class="page-title">Banco de Talentos</div>
  <p class="page-sub">Encontre jovens atletas de todo o Brasil com análise completa de IA.</p>

  <div class="filtros">
    <div class="fg"><label>Estado</label><select id="fEst"><option value="">Todos os estados</option><option>AC</option><option>AL</option><option>AM</option><option>AP</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MG</option><option>MS</option><option>MT</option><option>PA</option><option>PB</option><option>PE</option><option>PI</option><option>PR</option><option>RJ</option><option>RN</option><option>RO</option><option>RR</option><option>RS</option><option>SC</option><option>SE</option><option>SP</option><option>TO</option></select></div>
    <div class="fg"><label>Posição</label><select id="fPos"><option value="">Todas as posições</option><option>Goleiro</option><option>Lateral Direito</option><option>Lateral Esquerdo</option><option>Zagueiro</option><option>Volante</option><option>Meia</option><option>Atacante</option><option>Ponta Direita</option><option>Ponta Esquerda</option></select></div>
    <div class="fg"><label>Cidade</label><input type="text" id="fCid" placeholder="Qualquer cidade"></div>
    <div class="fg"><label>Score mínimo IA</label><select id="fScore"><option value="0">Qualquer score</option><option value="50">50+ (Médio)</option><option value="70">70+ (Bom)</option><option value="80">80+ (Ótimo)</option><option value="90">90+ (Excepcional)</option></select></div>
    <button class="btn-buscar" onclick="buscar()">Buscar</button>
  </div>

  <div class="results-header">
    <div class="results-count">Mostrando <span id="count">0</span> atletas</div>
  </div>

  <div class="atletas-grid" id="grid">
    <div class="empty-state"><div class="emo">🔍</div><p>Clique em "Buscar" para ver os talentos.</p></div>
  </div>
</main>

<script>
const SURL='https://yrthxqmzuwurgthdfozx.supabase.co';
const SKEY='sb_publishable_sPcnhj8prRj6UagRwFqrUA_73ZeFxC5';
const {createClient}=supabase;
const sb=createClient(SURL,SKEY);

function ini(n){return n?n.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase():'??'}
function sc(s){return s>=75?'score-alto':s>=50?'score-medio':'score-baixo'}
function idade(d){if(!d)return null;const a=new Date(d);const hoje=new Date();return hoje.getFullYear()-a.getFullYear();}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  document.getElementById('userEmail').textContent=session.user.email;
  document.getElementById('loading').style.display='none';
  await buscar();
}

async function buscar(){
  const est=document.getElementById('fEst').value;
  const pos=document.getElementById('fPos').value;
  const cid=document.getElementById('fCid').value.trim();
  const scoreMin=parseInt(document.getElementById('fScore').value)||0;

  let query=sb.from('atletas').select('*, videos(url,descricao,relatorio,criado_em)').order('criado_em',{ascending:false}).limit(60);
  if(est)query=query.eq('estado',est);
  if(pos)query=query.eq('posicao',pos);
  if(cid)query=query.ilike('cidade','%'+cid+'%');

  const{data,error}=await query;
  const grid=document.getElementById('grid');

  let lista=data||[];

  // Filtra por score mínimo se necessário
  if(scoreMin>0){
    lista=lista.filter(a=>{
      const melhorScore=Math.max(...(a.videos||[]).map(v=>v.relatorio?.score_geral||0),0);
      return melhorScore>=scoreMin;
    });
  }

  document.getElementById('count').textContent=lista.length;

  if(!lista.length){
    grid.innerHTML='<div class="empty-state"><div class="emo">🏟️</div><p>Nenhum atleta encontrado com esses filtros.</p></div>';
    return;
  }

  grid.innerHTML=lista.map(a=>{
    const videos=a.videos||[];
    const melhorVideo=videos.find(v=>v.relatorio)||videos[0];
    const rel=melhorVideo?.relatorio;
    const id=idade(a.data_nascimento);

    return `<div class="atleta-card">
      <div class="ac-top">
        <div class="ac-header">
          <div class="ac-avatar">${ini(a.nome)}</div>
          ${rel?`<div class="ac-score-big">
            <div class="ac-score-num ${sc(rel.score_geral)}">${rel.score_geral}</div>
            <div class="ac-score-label">Score IA</div>
          </div>`:''}
        </div>

        <div class="ac-nome">${a.nome||'Atleta'}</div>
        <div class="ac-loc">📍 ${a.cidade||'—'}, ${a.estado||'—'}</div>

        <div class="ac-tags">
          ${a.posicao?`<span class="ac-tag pos">${a.posicao}</span>`:''}
          ${id?`<span class="ac-tag">${id} anos</span>`:''}
          ${a.altura?`<span class="ac-tag">${a.altura}cm</span>`:''}
          ${videos.length?`<span class="ac-tag">🎬 ${videos.length} vídeo${videos.length>1?'s':''}</span>`:''}
        </div>

        ${rel?`
        <div class="mini-scores">
          <div class="ms-item"><div class="ms-label">Técnica</div><div class="ms-val ${sc(rel.score_tecnica)}">${rel.score_tecnica}</div></div>
          <div class="ms-item"><div class="ms-label">Físico</div><div class="ms-val ${sc(rel.score_fisico)}">${rel.score_fisico}</div></div>
          <div class="ms-item"><div class="ms-label">Tático</div><div class="ms-val ${sc(rel.score_tatico)}">${rel.score_tatico}</div></div>
          <div class="ms-item"><div class="ms-label">Potencial</div><div class="ms-val ${sc(rel.score_potencial)}">${rel.score_potencial}</div></div>
        </div>

        <div class="ac-resumo">${rel.resumo||''}</div>

        <div class="ac-pontos">
          ${(rel.pontos_positivos||[]).slice(0,2).map(p=>`<div class="ac-ponto pos">✓ ${p}</div>`).join('')}
          ${(rel.pontos_atencao||[]).slice(0,1).map(p=>`<div class="ac-ponto neg">⚠ ${p}</div>`).join('')}
        </div>

        ${rel.recomendacao?`<div class="ac-rec">🏆 ${rel.recomendacao}</div>`:''}
        `:`
        <div class="sem-ia">
          <div class="sem-ia-icon">⏳</div>
          <div class="sem-ia-txt">Análise de IA ainda não disponível para este atleta.</div>
        </div>
        `}
      </div>

      <div class="ac-footer">
        ${melhorVideo?.url
          ?`<a href="${melhorVideo.url}" target="_blank" class="btn-video">🎬 Ver vídeo</a>`
          :`<span class="btn-video-sem">Sem vídeo</span>`}
        <span class="ac-data">${a.criado_em?new Date(a.criado_em).toLocaleDateString('pt-BR'):''}</span>
      </div>
    </div>`;
  }).join('');
}

async function sair(){await sb.auth.signOut();window.location.href='index.html';}
init();
</script>
</body>
</html>
